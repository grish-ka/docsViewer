[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docsviewer"
dynamic = ["version"]
description = "A desktop GUI for reading your project's docs/ folder, plus a scaffolder to create one."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "grish-ka", email = "grishka.krot@gmail.com" }]
keywords = ["markdown", "documentation", "docs", "viewer", "gui", "qt", "pyside6"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "PySide6>=6.7",
    "markdown-it-py>=3.0",
    "linkify-it-py>=2.0",
    "mdit-py-plugins>=0.4",
    "Pygments>=2.17",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
docsviewer = "docsviewer.cli:main"

[project.gui-scripts]
# Windows: launches without allocating a console at all. Use it for shortcuts.
# Prints nothing, so `init` output is invisible here -- use `docsviewer` for that.
docsviewerw = "docsviewer.cli:main"

[project.urls]
Homepage = "https://github.com/grish-ka/docsViewer"
Issues = "https://github.com/grish-ka/docsViewer/issues"

[tool.hatch.version]
path = "src/docsviewer/__init__.py"

[tool.hatch.build.targets.wheel]
# Everything under the package directory ships, assets/ included.
packages = ["src/docsviewer"]

[tool.hatch.build.targets.wheel.force-include]
# `init` copies these at runtime, so the docs must live inside the installed
# package. The source is outside src/, hence the explicit mapping.
"docs" = "docsviewer/docs"

[tool.hatch.build.targets.sdist]
include = [
    "src/docsviewer",
    "docs",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "requirements.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
